name: Academy OS production release
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Academy OS quality gate']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: academy-os-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: ACADEMY_RELEASE_SHA="$(git rev-parse HEAD)" npm run build:cloudflare
      - name: Check Cloudflare credentials safely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing Cloudflare API token"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing Cloudflare account ID"; exit 1; }
          node --input-type=module -e '
            const token = process.env.CLOUDFLARE_API_TOKEN ?? "";
            const account = process.env.CLOUDFLARE_ACCOUNT_ID ?? "";
            if (token !== token.trim() || /\\s|"/.test(token) || /^(Bearer|curl|CLOUDFLARE_API_TOKEN=|\\{)/i.test(token)) {
              console.error("Malformed Cloudflare API token secret: save the raw token only, without prefixes, commands, quotes or spaces.");
              process.exit(1);
            }
            if (!/^[a-f0-9]{32}$/i.test(account)) {
              console.error("Malformed Cloudflare account ID: expected 32 hexadecimal characters.");
              process.exit(1);
            }
            console.log("Credential format passed; validity will be verified by Cloudflare.");
          '

      - name: Confirm commit is still the current main release
        id: latest
        run: |
          git fetch --no-tags --depth=1 origin main
          current=$(git rev-parse origin/main)
          tested=$(git rev-parse HEAD)
          if [ "$tested" = "$current" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Deploying current, tested main commit: $tested"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Superseded: tested $tested, current main $current. Safely skipping stale deployment."
          fi
      - name: Bootstrap absent encryption secret (preserve existing key)
        if: steps.latest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/bootstrap-cloudflare-records-key.mjs
      - name: Apply idempotent D1 schema
        if: steps.latest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute ktws-academy-school --remote --config cloudflare/wrangler.jsonc --file cloudflare/schema.sql
      - name: Deploy Cloudflare Worker and assets
        if: steps.latest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config cloudflare/wrangler.jsonc
      - name: Verify configured Worker secret names without exposing values
        if: steps.latest.outputs.deploy == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          npx wrangler secret list --config cloudflare/wrangler.jsonc --format json > "$tmp"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const listed=JSON.parse(readFileSync(process.argv[1],"utf8"));
            const available=new Set((Array.isArray(listed)?listed:[]).map(x=>x.name));
            for(const name of ["RECORDS_ENCRYPTION_KEY","OPENAI_API_KEY","TWILIO_AUTH_TOKEN","RESEND_API_KEY"]){
              console.log(name+": "+(available.has(name)?"secret configured":"secret not configured")+" (presence only; validity not verified)");
            }
          ' "$tmp"
      - name: Read-only data recovery and document inventory
        if: steps.latest.outputs.deploy == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          files=$(mktemp)
          bookmark=$(mktemp)
          trap 'rm -f "$files" "$bookmark"' EXIT
          npx wrangler d1 execute ktws-academy-school --remote --json --config cloudflare/wrangler.jsonc --command="SELECT CASE WHEN COUNT(*)>0 THEN 'EXISTING' ELSE 'EMPTY' END AS evidence_state FROM school_files;" > "$files"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const x=JSON.parse(readFileSync(process.argv[1],"utf8"));
            const item=Array.isArray(x)?x[0]:x;
            const state=item?.results?.[0]?.evidence_state||item?.result?.results?.[0]?.evidence_state;
            console.log("Prior school document metadata: "+(state==="EXISTING"?"present — check recovery key before generating a replacement":state==="EMPTY"?"no records — no prior uploaded documents in this metadata table":"unknown — manual review required"));
          ' "$files"
          npx wrangler d1 time-travel info ktws-academy-school --json --config cloudflare/wrangler.jsonc > "$bookmark"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const x=JSON.parse(readFileSync(process.argv[1],"utf8"));
            const marker=x?.bookmark||x?.result?.bookmark;
            console.log("D1 Time Travel current bookmark: "+(typeof marker==="string"&&marker.length>0?"available (recovery not tested)":"not verified"));
          ' "$bookmark"
      - name: Public endpoint smoke check
        if: steps.latest.outputs.deploy == 'true'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 4 https://academy.ktworldsolutions.com/ > /dev/null
          health=$(curl --silent --output /dev/null --write-out '%{http_code}' https://academy.ktworldsolutions.com/api/health)
          test "$health" = "200" || { echo "Expected healthy API response 200, got $health"; exit 1; }
          expected=$(git rev-parse HEAD)
          # Wait for the deployed Worker to serve the reviewed build; a successful upload alone is insufficient.
          for attempt in 1 2 3 4 5 6; do
            body=$(curl --silent --show-error --fail https://academy.ktworldsolutions.com/api/health || true)
            if node -e 'try { const value=JSON.parse(process.argv[1]);process.exit(value.ok&&value.release===process.argv[2]?0:1) } catch { process.exit(1) }' "$body" "$expected"; then
              echo "Public deployment verified for commit $expected"
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Deployment version mismatch: the public health endpoint does not report the reviewed commit $expected"
              exit 1
            fi
            sleep 5
          done
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' https://academy.ktworldsolutions.com/api/auth/me)
          test "$status" = "401" || { echo "Expected unauthenticated API response 401, got $status"; exit 1; }
          # Verify default-deny on real deployed Worker routes. Use no real
          # student records, credentials, sessions or external accounts.
          for endpoint in /api/records /api/files /api/partner/me /api/partner/portal; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://academy.ktworldsolutions.com$endpoint")
            test "$status" = "401" || { echo "Unauthenticated route $endpoint expected 401; got $status"; exit 1; }
          done
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' https://academy.ktworldsolutions.com/api/partner/admin)
          test "$status" = "403" || { echo "External partner administration expected 403; got $status"; exit 1; }
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Cookie: academy_session=invalid-test-session' https://academy.ktworldsolutions.com/api/auth/me)
          test "$status" = "401" || { echo "Forged session expected 401; got $status"; exit 1; }
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --header 'Origin: https://not-the-school.invalid' --header 'Content-Type: application/json' --data '{}' https://academy.ktworldsolutions.com/api/records)
          test "$status" = "403" || { echo "Cross-site record update expected 403; got $status"; exit 1; }
          echo 'Public access gates verified: protected routes deny anonymous sessions and cross-site writes.'
