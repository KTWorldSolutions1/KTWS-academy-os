name: Academy OS quality gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run build:cloudflare
      - run: npx wrangler deploy --dry-run --config cloudflare/wrangler.jsonc
